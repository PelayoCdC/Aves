name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push que cancela al anterior: no tiene sentido gastar minutos en verificar
# un commit que ya ha quedado obsoleto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Los modelos y el catalogo NO estan en el repositorio: los de BirdNET v2.4
      # son CC BY-NC-SA y el catalogo deriva de eBird. La compilacion y los tests
      # unitarios no los necesitan, porque son assets que solo hacen falta en
      # tiempo de ejecucion. Los tests instrumentados si, y por eso no se
      # ejecutan aqui todavia (ver el TODO de abajo).

      - name: Compilar ambos flavors
        run: ./gradlew assemblePersonalDebug assembleOpenDebug --no-daemon

      # El release NUNCA se habia compilado. R8 con dos runtimes nativos (LiteRT,
      # ONNX Runtime), Ktor y kotlinx.serialization es exactamente donde
      # aparecen las clases que faltan; mejor aqui que en el movil de alguien.
      # Sin firma: el APK sale sin firmar, que basta para saber que R8 pasa.
      - name: Compilar los dos releases
        run: ./gradlew :app:assembleOpenRelease :app:assemblePersonalRelease --no-daemon

      # Que R8 pase no basta: el primer release compilaba y habria cascado en
      # la primera inferencia, porque renombraba clases de ONNX Runtime que la
      # parte nativa busca por nombre (OrtException -> d63). Esto comprueba en
      # el mapping que las clases que el JNI necesita conservan su nombre.
      - name: R8 conserva lo que buscan los runtimes nativos
        run: |
          fallo=0
          for clase in ai.onnxruntime.OrtException 'ai.onnxruntime.OrtSession$Result' ai.onnxruntime.OnnxTensor ai.onnxruntime.TensorInfo; do
            if ! grep -qF "$clase -> $clase:" app/build/outputs/mapping/openRelease/mapping.txt; then
              echo "::error::R8 ha renombrado $clase en openRelease; revisa app/proguard-rules.pro"
              fallo=1
            fi
          done
          for clase in org.tensorflow.lite.NativeInterpreterWrapper org.tensorflow.lite.Tensor; do
            if ! grep -qF "$clase -> $clase:" app/build/outputs/mapping/personalRelease/mapping.txt; then
              echo "::error::R8 ha renombrado $clase en personalRelease; revisa app/proguard-rules.pro"
              fallo=1
            fi
          done
          exit $fallo

      - name: Lint de los dos flavors
        run: ./gradlew :app:lintOpenDebug :app:lintPersonalDebug --no-daemon

      # Solo las variantes debug: las de release ejecutan los mismos tests otra
      # vez y doblaban el tiempo sin probar nada nuevo.
      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest testOpenDebugUnitTest testPersonalDebugUnitTest :core:common:test :core:model:test --no-daemon

      - name: Resumen de tests
        if: always()
        run: |
          total=0; fallos=0
          for f in $(find . -path "*/test-results/*" -name "TEST-*.xml"); do
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            er=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total+t)); fallos=$((fallos+fl+er))
          done
          echo "### $total tests, $fallos fallos" >> $GITHUB_STEP_SUMMARY

      - name: Informes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

  licencias:
    name: Guardia de licencias
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # ESTE ES EL TRABAJO QUE MAS IMPORTA DE TODA LA CI.
      #
      # Los modelos de BirdNET v2.4 son CC BY-NC-SA 4.0: no se pueden distribuir.
      # El flavor `open` existe para poder publicar, y basta que alguien escriba
      # `implementation` en vez de `personalImplementation` en una linea del
      # build para que un modelo no comercial acabe dentro de un APK publicable.
      # Nada lo avisaria.
      #
      # `testOpenDebugUnitTest` comprueba por reflexion que las clases de los
      # modelos restringidos NO estan en el classpath del flavor publicable.
      # `testPersonalDebugUnitTest` comprueba lo contrario, para que el primero
      # no pueda pasar por la razon equivocada (que alguien rompiera el enlace
      # en los dos flavors a la vez).
      - name: El flavor publicable no puede contener modelos no comerciales
        run: ./gradlew :app:testOpenDebugUnitTest --no-daemon

      - name: El flavor personal si debe traer BirdNET
        run: ./gradlew :app:testPersonalDebugUnitTest --no-daemon

  # Tests instrumentados que NO necesitan modelos: las migraciones de Room. Es
  # lo unico de la base que no se regenera (la coleccion del usuario), y una
  # migracion rota no avisa hasta que el movil de alguien no abre la app.
  migraciones:
    name: Migraciones de la base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM para que el emulador vaya a una velocidad razonable en el runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: MigrationTest y LookalikesDaoTest en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :core:database:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pelayo.aves.core.database.MigrationTest,dev.pelayo.aves.core.database.LookalikesDaoTest --no-daemon

  # TODO: el resto de tests instrumentados. Necesitan los modelos y el
  # catalogo, que no estan en el repositorio. Habria que descargarlos en el
  # runner (BirdNET y BirdNET+ son publicos; el clasificador de imagen requiere
  # cuenta de Kaggle y por tanto un secreto). Hoy solo corren en local.
